name: CI

# Checks every push to the working branches and every PR into dev/main: types, lint, the tests
# (money and date logic, receipt reading, the Shortcut endpoint, and the database: every
# migration replayed, then each account checked to see only its own data) and a production build.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [chewshen, dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Placeholder values: the build only needs them to exist. No secrets in CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: 1
