name: Backup

# Weekly encrypted backup of the database (README → Backups). The file is encrypted with your age
# public key before upload, so the artifact is unreadable without your private key (this repo is
# public: anyone signed in to GitHub can download its artifacts). Each run is logged in job_runs,
# so Settings → Account shows the last backup and Overview warns if one fails or a week is missed.
# GitHub also emails you when a scheduled run fails.
on:
  schedule:
    - cron: "0 18 * * 6" # Saturday 18:00 UTC = Sunday 2am Malaysia time
  workflow_dispatch: # Actions → Backup → Run workflow

permissions:
  contents: read

concurrency:
  group: backup

jobs:
  backup:
    if: github.repository == 'ChewShen/budget-tracker' # not in forks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        run: |
          if [ -z "$DB_URL" ] || [ -z "$RECIPIENT" ]; then
            echo "::error::Set the SUPABASE_DB_URL secret and the BACKUP_AGE_RECIPIENT variable (README → Backups)."
            exit 1
          fi
          case "$RECIPIENT" in age1*) ;; *) echo "::error::BACKUP_AGE_RECIPIENT must be an age public key (age1…), never the private key."; exit 1 ;; esac

      - name: Install pg_dump 17 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 age >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Back up and encrypt
        id: backup
        run: |
          file="$(scripts/backup.sh out | tee /dev/stderr | cut -d' ' -f1)"
          echo "name=$(basename "$file" .tar.gz.age)" >> "$GITHUB_OUTPUT"

      - name: Upload (encrypted)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.name }}
          path: out/*.age
          retention-days: 90
          if-no-files-found: error

      - name: Log the run in the app
        if: always() && env.DB_URL != ''
        run: |
          if [ "${{ steps.backup.outcome }}" = success ] && [ "${{ steps.upload.outcome }}" = success ]; then ok=true; detail=""; else ok=false; detail="See GitHub → Actions → Backup."; fi
          psql "$DB_URL" -q -v ON_ERROR_STOP=1 -v ok="$ok" -v detail="$detail" <<'SQL' || echo "::warning::Couldn't log the run (has 2026-10-04_job_runs.sql been run?)"
          INSERT INTO public.job_runs (job, ok, detail) VALUES ('backup', :'ok'::boolean, NULLIF(:'detail', ''));
          SQL
